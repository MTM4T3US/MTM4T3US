  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scanbar { animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-100px); } to { transform: translateY(474px); } }
