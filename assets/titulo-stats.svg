  </filter></defs>
<style>
  text { font-family: 'Courier New', Courier, monospace; }
  .t { font-family: Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; font-weight: 700; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bar { animation: grow 2.5s ease-out both; transform-box: fill-box; transform-origin: left; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>
