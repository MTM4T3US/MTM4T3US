<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 200" width="410" height="200" role="img" aria-label="Foco: Engenharia de Software. Projetar e construir sistemas bem feitos, do banco ao front-end."><defs>
  <radialGradient id="bgg" cx="50%" cy="35%" r="80%">
    <stop offset="0" stop-color="#005c25"/>
    <stop offset=".5" stop-color="#002a11"/>
    <stop offset="1" stop-color="#000f06"/>
  </radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#00ff41" stroke-opacity=".08"/>
  </pattern>
  <pattern id="lines" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#000" fill-opacity=".22"/>
  </pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00ff41" stop-opacity=".09"/>
    <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowS" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="1.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="round"><rect width="410" height="200" rx="14"/></clipPath>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff41" stop-opacity=".55"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#00ff41" stop-opacity=".05"/><stop offset="1" stop-color="#00ff41" stop-opacity=".5"/>
  </linearGradient></defs><style>
  text { font-family: 'Courier New', Courier, monospace; }
  .b { font-family: Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', 'Courier New', monospace; font-weight: 700; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scanbar { animation: scan 7s linear infinite; }
  @keyframes scan { from { transform: translateY(-120px); } to { transform: translateY(200px); } }
  .run { animation: run 6s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -1220; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 8s linear infinite; }
  .spinr { transform-box: fill-box; transform-origin: center; animation: spin 5s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .show { opacity: 0; animation: appear .2s ease-out forwards; }
  @keyframes appear { to { opacity: 1; } }
  .hover { animation: hover 3s ease-in-out infinite; }
  @keyframes hover { 50% { transform: translateY(-6px); } }
  .rotor { transform-box: fill-box; transform-origin: center; animation: rotor .18s linear infinite; }
  @keyframes rotor { 50% { transform: scaleX(.15); } }
  .beamp { animation: beam 1.6s ease-in-out infinite; }
  @keyframes beam { 50% { opacity: .35; } }
  .road { animation: road .6s linear infinite; }
  @keyframes road { to { stroke-dashoffset: 24; } }
  .bounce { animation: bounce .5s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-2px); } }
  .speed { animation: speed .5s steps(2) infinite; }
  @keyframes speed { 50% { opacity: .3; transform: translateX(-6px); } }
  .rise { opacity: 0; animation: rise 2.8s ease-out infinite; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px); } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  .shackle { animation: lock 3s ease-in-out infinite; }
  @keyframes lock { 0%,60%,100% { transform: translateY(0); } 75% { transform: translateY(-5px); } }</style>
<g clip-path="url(#round)">
  <rect width="410" height="200" fill="url(#bgg)"/><rect width="410" height="200" fill="url(#grid)"/>
  <rect x="14" y="14" width="148" height="172" rx="10" fill="#000f06" fill-opacity=".6" stroke="#00ff41" stroke-opacity=".3"/>
  
  <path class="spin" d="M120.0,104.0 L129.4,111.8 L127.6,119.5 L115.6,122.2 L112.4,127.5 L115.4,139.4 L109.4,144.5 L98.2,139.6 L92.4,142.0 L87.8,153.4 L80.0,154.0 L73.7,143.5 L67.6,142.0 L57.3,148.6 L50.6,144.5 L51.7,132.3 L47.6,127.5 L35.4,126.7 L32.4,119.5 L40.5,110.3 L40.0,104.0 L30.6,96.2 L32.4,88.5 L44.4,85.8 L47.6,80.5 L44.6,68.6 L50.6,63.5 L61.8,68.4 L67.6,66.0 L72.2,54.6 L80.0,54.0 L86.3,64.5 L92.4,66.0 L102.7,59.4 L109.4,63.5 L108.3,75.7 L112.4,80.5 L124.6,81.3 L127.6,88.5 L119.5,97.7 Z" fill="#001a0c" stroke="#00ff41" stroke-width="2.5" filter="url(#glowS)"/>
  <circle cx="80" cy="104" r="28" fill="#00331a" stroke="#00c832" stroke-width="2"/>
  <path class="spinr" d="M148.0,60.0 L153.4,64.9 L151.8,69.5 L144.5,70.0 L142.0,72.5 L141.5,79.8 L136.9,81.4 L132.0,76.0 L128.4,75.6 L122.5,79.8 L118.3,77.2 L119.5,70.0 L117.6,66.9 L110.6,64.9 L110.0,60.0 L116.4,56.4 L117.6,53.1 L114.8,46.3 L118.3,42.8 L125.1,45.6 L128.4,44.4 L132.0,38.0 L136.9,38.6 L138.9,45.6 L142.0,47.5 L149.2,46.3 L151.8,50.5 L147.6,56.4 Z" fill="#001a0c" stroke="#00c832" stroke-width="2"/>
  <text class="b" x="80" y="111" font-size="20" fill="#00ff41" text-anchor="middle" filter="url(#glowS)">&lt;/&gt;</text>
  <text x="176" y="40" font-size="12" fill="#3ddc6a">[ foco_01 ]</text>
  <text class="b" x="176" y="72" font-size="22" fill="#00ff41" filter="url(#glowS)">Engenharia de</text><text class="b" x="176" y="98" font-size="22" fill="#00ff41" filter="url(#glowS)">Software</text>
  <text x="176" y="130" font-size="13" fill="#c4ffd3">Projetar e construir</text><text x="176" y="149" font-size="13" fill="#c4ffd3">sistemas bem feitos,</text><text x="176" y="168" font-size="13" fill="#c4ffd3">do banco ao front-end.</text>
  <rect class="scanbar" width="410" height="120" fill="url(#scan)"/><rect width="410" height="200" fill="url(#lines)"/>
</g>
<rect x="1" y="1" width="408" height="198" rx="13" fill="none" stroke="#00ff41" stroke-opacity=".45" stroke-width="2"/><rect class="run" x="1" y="1" width="408" height="198" rx="13" fill="none" stroke="#00ff41" stroke-width="3" stroke-dasharray="140 1080" filter="url(#glowS)"/>
</svg>